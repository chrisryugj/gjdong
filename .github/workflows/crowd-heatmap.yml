name: Crowd Heatmap

# 서울시 실시간 혼잡도(직전 12시간 실측)를 3시간마다 수집해 data 브랜치 heatmap.json에 누적
# 12시간 룩백 + lastSlot 중복방지라 cron이 몇 번 빠져도 갭 없이 자가치유됨
# (Vercel Hobby cron은 일 1회 제한이라 GitHub Actions 사용)
# cron 분은 정시 근처(:00~:15)를 피한다 — GH Actions 스케줄이 그 구간에 몰려 지연·누락이 잦다
on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:
    inputs:
      fresh:
        description: "누적을 버리고 처음부터 다시 쌓기 (data 브랜치 복구용)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # SeoulRtd가 1~2분 통째로 안 열릴 때가 있어 스크립트 내부 30초 백오프로는 부족하다.
      # 단계 자체를 최대 3회(90초 간격)까지 다시 돌려 5분 남짓의 서버 끊김을 흡수한다.
      - run: |
          for i in 1 2 3; do
            node scripts/collect-crowd-heatmap.mjs && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::collect attempt $i failed — retry in 90s"; sleep 90; }
          done
          exit 1
        env:
          FRESH: ${{ inputs.fresh && '1' || '' }}
      # data는 heatmap.json만 든 orphan 브랜치라 Vercel이 빌드하면 반드시 실패한다.
      # 발행물에도 같은 설정을 넣어 브랜치 자체가 배포 대상에서 빠지게 한다.
      - run: echo '{"git":{"deploymentEnabled":{"data":false}}}' > out-data/vercel.json
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: data
          publish_dir: ./out-data
          force_orphan: true
          commit_message: "chore: heatmap snapshot"
