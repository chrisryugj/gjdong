name: Crowd Heatmap

# 서울시 실시간 혼잡도를 매시 수집해 data 브랜치 heatmap.json에 누적
# (Vercel Hobby cron은 일 1회 제한이라 GitHub Actions 사용)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/collect-crowd-heatmap.mjs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: data
          publish_dir: ./out-data
          force_orphan: true
          commit_message: "chore: heatmap snapshot"
