<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  :root {
    --ink: #16202B; --paper: #F7F4EC; --accent: #C9603F;
    --line: rgba(247,244,236,.16); --muted: rgba(247,244,236,.58); --faint: rgba(247,244,236,.40);
    --mono: 'SFMono-Regular', ui-monospace, Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--ink);
    font-family: 'Pretendard', system-ui, sans-serif; color: var(--paper); word-break: keep-all; }
  .stage { position: relative; width: 100%; height: 100%; padding: 60px 64px 54px; display: flex; flex-direction: column; }

  .meta { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); }
  .meta .tag { display: flex; align-items: center; gap: 12px; }
  .meta .bar { width: 24px; height: 1px; background: var(--accent); }

  .kicker { font-size: 14px; letter-spacing: .04em; color: var(--muted); margin-top: 42px; }
  .headline { margin-top: 12px; font-weight: 800; font-size: 48px; line-height: 1.12; letter-spacing: -.025em; }
  .headline em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 14px; font-size: 18px; color: var(--muted); line-height: 1.45; }

  .flow { flex: 1; display: grid; grid-template-columns: 1fr 96px 1.08fr; gap: 20px; align-items: center; margin-top: 24px; }
  .col-h { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; margin-bottom: 16px; }
  .col-h.in { color: var(--faint); }
  .col-h.out { color: var(--accent); }

  .in-list { display: flex; flex-direction: column; gap: 12px; }
  .in-card { display: flex; align-items: center; gap: 16px; padding: 15px 20px; border: 1px solid var(--line); border-radius: 12px; opacity: 0; }
  .in-card .t { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--accent); flex: none; width: 52px; }
  .in-card .v { font-size: 22px; font-weight: 700; letter-spacing: -.01em; color: var(--paper); }

  .arrow { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .arrow .line { width: 100%; height: 2px; background: var(--accent); position: relative; transform-origin: left center; transform: scaleX(0); }
  .arrow .line::after { content: ''; position: absolute; right: -1px; top: 50%; transform: translateY(-50%); border-left: 12px solid var(--accent); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  .arrow .pill { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); opacity: 0; white-space: nowrap; }

  .out-card { position: relative; padding: 30px 32px; border: 1px solid rgba(201,96,63,.5); border-radius: 16px; background: rgba(201,96,63,.08); opacity: 0; }
  .out-card .cap { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .out-card .std { margin-top: 14px; font-size: 30px; font-weight: 800; line-height: 1.3; letter-spacing: -.02em; color: var(--paper); }
  .out-card .std em { font-style: normal; color: var(--accent); }
  .out-card .std .dim { color: var(--muted); font-weight: 700; }
  .out-row { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .out-chip { font-size: 14px; font-weight: 700; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); opacity: 0; }
  .pin { position: absolute; right: 32px; top: 28px; width: 40px; height: 40px; border-radius: 50% 50% 50% 0; background: var(--accent); transform: rotate(-45deg) scale(0); }
  .pin::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--ink); }

  .page { position: absolute; bottom: 30px; right: 64px; font-family: var(--mono); font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1280" data-height="720">
    <div class="stage">
      <div class="meta"><span class="tag"><span class="bar"></span>표준주소실록이 하는 일</span><span>왜 쓰나요</span></div>
      <div id="cap" class="kicker">뒤죽박죽 주소, 하나로 정리</div>
      <h1 id="head" class="headline">어떻게 써도 — <em>하나로 정리됩니다.</em></h1>
      <p id="sub" class="sub">도로명이든 지번이든 건물 이름이든, 넣기만 하면 표준 형식으로 통일됩니다.</p>

      <div class="flow">
        <div>
          <div class="col-h in">이렇게 들어와도</div>
          <div class="in-list">
            <div class="in-card ic"><span class="t">지번</span><span class="v">자양동 870</span></div>
            <div class="in-card ic"><span class="t">건물명</span><span class="v">광진구청</span></div>
            <div class="in-card ic"><span class="t">도로명</span><span class="v">아차산로 400</span></div>
            <div class="in-card ic"><span class="t">행정동</span><span class="v">자양2동</span></div>
          </div>
        </div>
        <div class="arrow">
          <div id="arrowLine" class="line"></div>
          <div id="arrowPill" class="pill">표준 변환</div>
        </div>
        <div>
          <div class="col-h out">이렇게 나옵니다</div>
          <div id="outCard" class="out-card">
            <div class="cap">표준형식 (전체)</div>
            <div class="std">서울특별시 광진구 <em>아차산로 400</em><br><span class="dim">(자양동 870, 자양2동)</span></div>
            <div class="out-row">
              <span class="out-chip oc">도로명</span><span class="out-chip oc">지번</span><span class="out-chip oc">행정동</span><span class="out-chip oc">우편번호</span>
            </div>
            <div id="pin" class="pin"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    gsap.set('#cap', { opacity: 0, y: -6 });
    gsap.set('#head', { opacity: 0, y: 16 });
    gsap.set('#sub', { opacity: 0, y: 10 });
    tl.to('#cap', { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 0.0);
    tl.to('#head', { opacity: 1, y: 0, duration: 0.55, ease: 'power2.out' }, 0.12);
    tl.to('#sub', { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 0.32);
    gsap.utils.toArray('.ic').forEach((el, i) => {
      gsap.set(el, { opacity: 0, x: -30 });
      tl.to(el, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' }, 0.7 + i * 0.16);
    });
    tl.to('#arrowLine', { scaleX: 1, duration: 0.55, ease: 'power2.inOut' }, 1.45);
    tl.to('#arrowPill', { opacity: 1, duration: 0.35 }, 1.75);
    tl.fromTo('#outCard', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 2.05);
    gsap.utils.toArray('.oc').forEach((el, i) => tl.to(el, { opacity: 1, duration: 0.3 }, 2.6 + i * 0.11));
    tl.to('#pin', { scale: 1, duration: 0.55, ease: 'back.out(2)' }, 2.9);
    tl.to('.ic', { opacity: 0.5, duration: 0.5 }, 3.1);
    window.__timelines['main'] = tl;
  </script>
</body>
</html>
