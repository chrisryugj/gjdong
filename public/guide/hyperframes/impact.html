<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  :root {
    --ink: #16202B; --paper: #F7F4EC; --accent: #C9603F;
    --line: rgba(247,244,236,.16); --muted: rgba(247,244,236,.58); --faint: rgba(247,244,236,.40);
    --mono: 'SFMono-Regular', ui-monospace, Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--ink);
    font-family: 'Pretendard', system-ui, sans-serif; color: var(--paper); word-break: keep-all; }
  .stage { position: relative; width: 100%; height: 100%; padding: 60px 64px 54px; display: flex; flex-direction: column; }

  .meta { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); }
  .meta .tag { display: flex; align-items: center; gap: 12px; }
  .meta .bar { width: 24px; height: 1px; background: var(--accent); }

  .kicker { font-size: 14px; letter-spacing: .04em; color: var(--muted); margin-top: 42px; }
  .headline { margin-top: 12px; font-weight: 800; font-size: 48px; line-height: 1.12; letter-spacing: -.025em; }
  .headline em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 14px; font-size: 18px; color: var(--muted); line-height: 1.45; }

  .duo { margin-top: 30px; display: grid; grid-template-columns: 1fr 100px 1fr; gap: 16px; align-items: center; }
  .panel { border: 1px solid var(--line); border-radius: 16px; padding: 30px 34px; min-height: 220px; display: flex; flex-direction: column; justify-content: center; opacity: 0; }
  .panel.after { border-color: rgba(201,96,63,.5); background: rgba(201,96,63,.08); }
  .p-lbl { font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  .panel.after .p-lbl { color: var(--accent); }
  .p-num { margin-top: 10px; font-weight: 800; letter-spacing: -.03em; line-height: .98; }
  .panel.before .p-num { font-size: 76px; color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(201,96,63,.7); text-decoration-thickness: 4px; }
  .panel.after .p-num { font-size: 104px; color: var(--accent); }
  .p-num small { font-size: .38em; font-weight: 700; margin-left: 6px; letter-spacing: -.01em; }
  .p-desc { margin-top: 14px; font-size: 17px; line-height: 1.4; }
  .panel.before .p-desc { color: var(--faint); }
  .panel.after .p-desc { color: var(--muted); }

  .mid { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mid .line { width: 70px; height: 2px; background: var(--accent); position: relative; transform-origin: left; transform: scaleX(0); }
  .mid .line::after { content: ''; position: absolute; right: -1px; top: 50%; transform: translateY(-50%); border-left: 11px solid var(--accent); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .mid .txt { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); opacity: 0; }

  .strip { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .cell { border-top: 1px solid var(--line); padding-top: 16px; opacity: 0; }
  .cell .v { font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1; color: var(--paper); }
  .cell .v em { font-style: normal; color: var(--accent); }
  .cell .l { margin-top: 10px; font-size: 15px; color: var(--muted); }

  .page { position: absolute; bottom: 30px; right: 64px; font-family: var(--mono); font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1280" data-height="720">
    <div class="stage">
      <div class="meta"><span class="tag"><span class="bar"></span>현장 방문 전, 주소 정리</span><span>얼마나 편해지나</span></div>
      <div id="cap" class="kicker">취약계층 100가구 방문 명단</div>
      <h1 id="head" class="headline">반나절 걸리던 일이, <em>3분</em>이 됩니다.</h1>
      <p id="sub" class="sub">주소를 하나하나 손으로 찾던 일을, 복사·붙여넣기 한 번에.</p>

      <div class="duo">
        <div id="pBefore" class="panel before">
          <div class="p-lbl">예전엔</div>
          <div class="p-num">4<small>시간+</small></div>
          <div class="p-desc">뒤죽박죽 주소를 손으로 하나씩 검색·정리</div>
        </div>
        <div class="mid">
          <div id="midLine" class="line"></div>
          <div id="midTxt" class="txt">복붙 한 번</div>
        </div>
        <div id="pAfter" class="panel after">
          <div class="p-lbl">지금은</div>
          <div class="p-num"><span id="minNum">0</span><small>분</small></div>
          <div class="p-desc">엑셀에서 통째로 붙여넣고 한 번에 변환</div>
        </div>
      </div>

      <div class="strip">
        <div class="cell sc"><div class="v"><span id="c1">0</span><em>건</em></div><div class="l">한 번에 변환 (최대 1,000건)</div></div>
        <div class="cell sc"><div class="v"><em>클릭 한 번</em></div><div class="l">지도 표시 · 엑셀 저장까지</div></div>
        <div class="cell sc"><div class="v"><em>0</em>원</div><div class="l">설치 없이 브라우저에서 무료</div></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    gsap.set('#cap', { opacity: 0, y: -6 });
    gsap.set('#head', { opacity: 0, y: 16 });
    gsap.set('#sub', { opacity: 0, y: 10 });
    tl.to('#cap', { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 0.0);
    tl.to('#head', { opacity: 1, y: 0, duration: 0.55, ease: 'power2.out' }, 0.12);
    tl.to('#sub', { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 0.32);
    tl.fromTo('#pBefore', { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.55, ease: 'power2.out' }, 0.7);
    tl.to('#midLine', { scaleX: 1, duration: 0.5, ease: 'power2.inOut' }, 1.2);
    tl.to('#midTxt', { opacity: 1, duration: 0.35 }, 1.5);
    tl.fromTo('#pAfter', { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 1.7);
    const mObj = { n: 0 };
    tl.to(mObj, { n: 3, duration: 1.0, ease: 'power2.out', onUpdate: () => { document.getElementById('minNum').textContent = Math.round(mObj.n); } }, 2.2);
    gsap.utils.toArray('.sc').forEach((el, i) => tl.fromTo(el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 3.0 + i * 0.16));
    const cObj = { n: 0 };
    tl.to(cObj, { n: 1000, duration: 1.3, ease: 'power3.out', onUpdate: () => { document.getElementById('c1').textContent = Math.round(cObj.n).toLocaleString('en-US'); } }, 3.2);
    window.__timelines['main'] = tl;
  </script>
</body>
</html>
